<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="/pageZoomGuard.js?v=20260920-mobile-page-zoom"></script>
    <title>Verification Sent - Benchmark</title>
    <link rel="icon" type="image/png" href="../../icons/baddy.png">
    <script src="../mobileViewportGuard.js?v=20260310-sub-score-input-1"></script>
    <link rel="stylesheet" href="../login.css?v=20260910-auth-layout-5">
    <style>
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            opacity: 1;
            pointer-events: none;
            z-index: 2147483647;
            transition: opacity 420ms ease;
        }

        html.page-entered .page-transition-overlay {
            opacity: 0;
        }

        .auth-home-link,
        .app-title,
        .auth-main {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 420ms ease, transform 420ms ease;
        }

        html.page-entered .auth-home-link,
        html.page-entered .app-title,
        html.page-entered .auth-main {
            opacity: 1;
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .page-transition-overlay,
            .auth-home-link,
            .app-title,
            .auth-main {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="page-transition-overlay" aria-hidden="true"></div>
    <a class="auth-home-link" href="/" aria-label="Open the KDAssist menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="auth-home-icon-body" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>
    <div class="auth-stage">
    <h1 class="app-title">Benchmark</h1>
    <div class="auth-main">
    <div class="login-container verification-container">
        <h2 class="verification-heading" data-auth-i18n="verification_heading">Check Your Email</h2>
        <div class="verification-message" data-auth-i18n-html="verification_message_html">
            We've sent a verification link to your email address.<br>
            Please check your <strong>spam folder</strong>.
        </div>
        <button id="loginRedirectBtn" class="btn btn-primary" data-auth-i18n="btn_go_to_login">Go to Login</button>
    </div>
    </div>
    </div>
    <script src="../auth-footer-loader.js"></script>
    <script type="module" src="../auth-i18n.js?v=20260309-auth-lang-dropdown-mobile-2"></script>
    <script type="module" src="../footer-baddy.js"></script>
    <script type="module" src="./verificationSentUI.js"></script>
    <script>
        (() => {
            const root = document.documentElement;
            const overlay = document.querySelector(".page-transition-overlay");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let leaving = false;

            function enterPage() {
                leaving = false;
                if (overlay) overlay.style.display = "block";
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        root.classList.add("page-entered");
                        if (overlay) {
                            setTimeout(() => {
                                if (!leaving) overlay.style.display = "none";
                            }, reducedMotion ? 0 : 500);
                        }
                    });
                });
            }

            enterPage();
            // Coming back with the browser back button restores the page from cache, so fade in again.
            window.addEventListener("pageshow", (event) => {
                if (event.persisted) enterPage();
            });

            // Leaving for the KDAssist menu: fade everything out to black first, then navigate.
            document.querySelectorAll(".auth-home-link").forEach((link) => {
                link.addEventListener("click", (event) => {
                    if (
                        leaving ||
                        event.defaultPrevented ||
                        event.button !== 0 ||
                        event.metaKey ||
                        event.ctrlKey ||
                        event.shiftKey ||
                        event.altKey
                    ) {
                        return;
                    }

                    event.preventDefault();
                    leaving = true;
                    if (overlay) {
                        overlay.style.display = "block";
                        void overlay.offsetWidth;
                    }
                    root.classList.remove("page-entered");
                    setTimeout(() => {
                        window.location.href = link.href;
                    }, reducedMotion ? 0 : 440);
                });
            });
        })();
    </script>
</body>
</html>
