# Rebuilds the file lists and color data for the assets page whenever images are added or removed
# in assets/Shields, Hats, Accessories or Mounts, so new files always show up on the site.
name: Update asset lists

on:
  push:
    branches: [main]
    paths:
      - 'assets/Shields/**'
      - 'assets/Hats/**'
      - 'assets/Accessories/**'
      - 'assets/Mounts/**'
      - '!**/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        working-directory: assets/tools
        run: npm install --no-save sharp
      - name: Rebuild lists
        run: node assets/tools/build-shield-colors.js --no-delete
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Shields/*.json assets/Hats/*.json assets/Accessories/*.json assets/Mounts/*.json
          if git diff --cached --quiet; then
            echo "Lists already up to date."
          else
            git commit -m "Update asset lists"
            git push
          fi
