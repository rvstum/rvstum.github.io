<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - Benchmark</title>
    <link rel="icon" type="image/png" href="../icons/baddy.png">
    <script src="mobileViewportGuard.js?v=20260310-sub-score-input-1"></script>
    <style>
        html.auth-bootstrap-pending body {
            display: none !important;
        }
    </style>
    <script>
        (function earlyRememberedAuthRedirect() {
            var root = document.documentElement;
            root.classList.add("auth-bootstrap-pending");
            var redirecting = false;
            var FIREBASE_API_KEY = "AIzaSyAiZHVFIXe8LrxGS-TklX-pIqC135IpIbY";
            var LOGIN_AUTH_BOOTSTRAP_SESSION_KEY = "__benchmark_login_auth_boot__";
            var LOGIN_BOOT_WINDOW_SESSION_KEY = "__benchmark_login_boot_window__";
            var LOGIN_HANDOFF_SESSION_KEY = "__benchmark_login_handoff__";
            var LOGIN_AUTH_BOOTSTRAP_WINDOW_MS = 15000;
            var LOGIN_BOOT_WINDOW_MS = 45000;
            var LOGIN_HANDOFF_WINDOW_MS = 30000;

            function getBenchmarkBasePath() {
                var pathname = window.location.pathname || "";
                var lower = pathname.toLowerCase();
                var marker = "/benchmark";
                var markerIndex = lower.indexOf(marker);
                if (markerIndex >= 0) {
                    return pathname.slice(0, markerIndex + marker.length) || "/benchmark";
                }
                var fallback = pathname.replace(/\/[^/]*$/, "");
                return fallback || "/benchmark";
            }

            function resolveSignedInUrl() {
                return getBenchmarkBasePath() + "/benchmark.html";
            }

            function hasPersistedVerifiedUser(storage) {
                if (!storage) return false;
                try {
                    for (var i = 0; i < storage.length; i += 1) {
                        var key = storage.key(i);
                        if (!key || key.indexOf("firebase:authUser:") !== 0) continue;
                        var raw = storage.getItem(key);
                        if (!raw) continue;
                        var parsed = JSON.parse(raw);
                        if (!parsed || typeof parsed !== "object") continue;
                        if (parsed.apiKey !== FIREBASE_API_KEY) continue;
                        if (!parsed.uid) continue;
                        if (parsed.emailVerified === false) continue;
                        var tokenManager = parsed.stsTokenManager && typeof parsed.stsTokenManager === "object"
                            ? parsed.stsTokenManager
                            : null;
                        var hasSessionToken = !!(tokenManager && (tokenManager.refreshToken || tokenManager.accessToken));
                        if (!hasSessionToken) continue;
                        return true;
                    }
                } catch (e) {
                    return false;
                }
                return false;
            }

            function armLoginRedirectGuards() {
                try {
                    var now = Date.now();
                    sessionStorage.setItem(LOGIN_AUTH_BOOTSTRAP_SESSION_KEY, JSON.stringify({
                        source: "remembered-session",
                        startedAt: now,
                        expiresAt: now + LOGIN_AUTH_BOOTSTRAP_WINDOW_MS
                    }));
                    sessionStorage.setItem(LOGIN_BOOT_WINDOW_SESSION_KEY, JSON.stringify({
                        source: "remembered-session",
                        startedAt: now,
                        expiresAt: now + LOGIN_BOOT_WINDOW_MS,
                        count: 0
                    }));
                    sessionStorage.setItem(LOGIN_HANDOFF_SESSION_KEY, JSON.stringify({
                        source: "remembered-session",
                        startedAt: now,
                        expiresAt: now + LOGIN_HANDOFF_WINDOW_MS
                    }));
                } catch (e) {}
            }

            try {
                var hasRememberedUser = hasPersistedVerifiedUser(window.sessionStorage)
                    || hasPersistedVerifiedUser(window.localStorage);
                if (!hasRememberedUser) return;
                redirecting = true;
                window.__BENCHMARK_LOGIN_REDIRECT_STARTED__ = true;
                armLoginRedirectGuards();
                window.location.replace(new URL(resolveSignedInUrl(), window.location.origin).toString());
            } catch (e) {
                redirecting = false;
            } finally {
                if (!redirecting) {
                    root.classList.remove("auth-bootstrap-pending");
                    window.__BENCHMARK_LOGIN_REDIRECT_STARTED__ = false;
                }
            }
        })();
    </script>
    <link rel="stylesheet" href="login.css?v=20260322-password-toggle-1">
</head>
<body>
    <h1 class="app-title">Benchmark</h1>
    <div class="auth-main">
    <div class="login-container">
        <h2 data-auth-i18n="login_heading">Login</h2>
        <div class="input-group">
            <label for="email" data-auth-i18n="label_email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="input-group">
            <label for="password" data-auth-i18n="label_password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="input-group" style="flex-direction: row; align-items: center; gap: 10px;">
            <input type="checkbox" id="rememberMe" style="width: auto;">
            <label for="rememberMe" style="margin: 0; cursor: pointer;" data-auth-i18n="label_remember_me">Remember me</label>
        </div>
        <button id="loginBtn" class="btn btn-primary" data-auth-i18n="btn_login">Login</button>
        <div class="alternative-actions">
            <a href="forgot-password" id="forgotPasswordLink" data-auth-i18n="link_forgot_password">Forgot Password?</a>
            <span>|</span>
            <a href="sign-up" id="signUpLink" data-auth-i18n="link_sign_up">Sign Up</a>
        </div>
        <p id="error-message" class="error-message"></p>
    </div>
    <div class="auth-lang-shell">
        <div class="auth-lang-dropdown" id="authLangDropdown">
            <button type="button" class="auth-lang-button" id="authLangButton" aria-expanded="false">Language</button>
            <div class="auth-lang-menu" id="authLangMenu"></div>
        </div>
    </div>
    </div>
    <script src="auth-footer-loader.js"></script>
    <script type="module" src="auth-i18n.js?v=20260309-auth-lang-dropdown-mobile-2"></script>
    <script type="module" src="footer-baddy.js"></script>
    <script type="module" src="loginUI.js?v=20260403-prepaint-auth-1"></script>
</body>
</html>
