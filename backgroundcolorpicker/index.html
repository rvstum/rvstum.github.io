<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Background Color Picker</title>
    <link rel="icon" type="image/png" href="/icons/bgcolorpickericon.png.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* green theme, taken from the page background */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        #home-menu-button {
            position: fixed;
            top: clamp(12px, 2vw, 18px);
            left: clamp(12px, 2vw, 18px);
            z-index: 2147483647;
        }

        .home-menu-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            color: #cccccc;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 180ms ease, opacity 180ms ease;
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid #444444;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .home-menu-link svg {
            width: 32px;
            height: 32px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
        }

        .home-menu-link .home-icon-body {
            fill: #333333;
        }

        .page-title {
            position: fixed;
            top: clamp(12px, 2vw, 18px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2147483646;
            pointer-events: none;
        }

        .page-title-main {
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: clamp(26px, 5vw, 60px);
            letter-spacing: 4px;
            text-shadow: 0 0 6px #000, 0 0 12px #000, 0 0 22px rgba(0, 0, 0, 0.9), 0 0 36px rgba(0, 0, 0, 0.7); /* black glow behind the title */
        }

        /* The text alone stays centered; the icon hangs off its right edge without shifting it. */
        .title-text {
            position: relative;
        }

        .title-icon {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 0.25em;
            height: 1.25em;
            width: auto;
        }

        .page-subtitle {
            color: #e6e6e6;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(11px, 1.4vw, 14px);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 18px rgba(0, 0, 0, 0.85);
        }

        @media (max-width: 820px) {
            .page-title-main {
                font-size: 40px;
            }

            .page-subtitle {
                font-size: 11px;
            }
        }

        .home-menu-link:focus-visible {
            outline: none;
            transform: scale(1.15);
        }

        .home-menu-link:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        @media (hover: hover) {
            .home-menu-link:hover {
                transform: scale(1.15);
                color: #ffffff;
            }
        }

        @media (max-width: 480px) {
            .home-menu-link svg {
                width: 28px;
                height: 28px;
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .image-container {
            width: min(96vw, 1700px);
            max-width: none;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
            background-color: #3b5998;
            border-radius: 6px;
        }

        .large-preview {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 0 0 1px #000000,
                        0 0 0 5px rgba(0, 0, 0, 0.55),
                        0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            position: relative;
            z-index: 2;
        }

        .color-overlay {
            position: absolute;
            inset: 0;
            border-radius: 6px;
            z-index: 3;
            pointer-events: none;
        }

        .controls-shell {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 15px;
            width: min(90vw, 430px);
            z-index: 10;
        }

        .tester-ui {
            position: relative;
            background: rgba(12, 12, 12, 0.72);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #444444;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .color-picker-box {
            position: relative;
            width: 100%;
            height: 140px;
            border-radius: 6px;
            border: 1px solid #444444;
            box-sizing: border-box;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
            background-color: #000000;
        }

        /* The shades are painted pixel by pixel (see drawShades) instead of with stacked CSS gradients,
           which could leave a faint diagonal line on some screens. */
        .shade-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Saturation/brightness box plus the hue strip. Stacked (strip underneath, horizontal) by default,
           side by side (strip on the right, vertical) on desktop. */
        .picker-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .picker-group .color-picker-box {
            flex: 1;
            width: auto;
            height: auto;
            min-height: 0;
        }

        .hue-strip {
            position: relative;
            flex: none;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #444444;
            box-sizing: border-box;
            cursor: pointer;
            touch-action: none;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
        }

        .hue-thumb {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 0 6px rgba(0, 0, 0, 0.5);
            background: var(--thumb-color, #ff0000);
            top: 50%;
            left: var(--hue-pos, 0%);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .color-picker-cursor {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 0 6px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @media (min-width: 821px) {
            .controls-shell {
                --picker-gap: 6px;
                --picker-w: clamp(160px, calc(100vw - 460px), 420px);
                /* shift left by half of (picker + gap) so panel + picker are centered together */
                transform: translateX(calc(-50% - (var(--picker-w) + var(--picker-gap)) / 2));
            }

            .picker-group {
                position: absolute;
                top: -1px;
                left: calc(100% + var(--picker-gap));
                width: var(--picker-w);
                height: calc(100% + 2px);
                flex-direction: row;
            }

            .hue-strip {
                width: 26px;
                height: auto;
                background: linear-gradient(to bottom, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            }

            .hue-thumb {
                top: var(--hue-pos, 0%);
                left: 50%;
            }
        }

        .tester-ui label {
            color: #e6e6e6;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row { display: flex; gap: 10px; }

        .tester-ui input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #333333;
            color: #00ff00;
            -webkit-text-fill-color: #00ff00;
            caret-color: #00ff00;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            border-radius: 4px;
        }

        .tester-ui input[type="text"]::placeholder {
            color: #00ff00;
            opacity: 1;
        }

        .tester-ui input[type="color"] {
            width: 44px;
            height: 38px;
            border: 1px solid #333333;
            background: rgba(0, 0, 0, 0.45);
            cursor: default;
            pointer-events: none;
            padding: 2px;
            border-radius: 4px;
        }

        .tester-ui input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.6);
        }

        .toggle-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 10px;
            width: 100%;
            box-sizing: border-box;
            color: #ffffff;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-row > label {
            grid-column: 1;
            white-space: nowrap;
        }

        .toggle-row input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00ff00;
        }

        .custom-slider {
            grid-column: 2;
            justify-self: stretch;
            position: relative;
            width: 100%;
            min-width: 0;
            height: 24px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        #suffixSlider {
            display: none;
        }

        .custom-slider-track {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 8px;
            transform: translateY(-50%);
            background: rgba(30, 30, 30, 0.75);
            border: 1px solid #333333;
            border-radius: 999px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .custom-slider-fill {
            width: 0%;
            height: 100%;
            background: #00ff00;
            border-radius: inherit;
        }

        .custom-slider-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            background: #00ff00;
            border: 1px solid #081108;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #00ff00, 0 0 7px rgba(0, 255, 0, 0.3);
        }

        .custom-slider:focus-visible .custom-slider-thumb {
            box-shadow: 0 0 0 1px #00ff00, 0 0 0 3px rgba(0, 255, 0, 0.2), 0 0 7px rgba(0, 255, 0, 0.3);
        }

        .custom-slider.is-disabled {
            cursor: default;
            filter: grayscale(1);
            opacity: 0.3;
        }

        #suffixLabel {
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            min-width: 25px;
        }

        #opacityLabel {
            grid-column: 3;
            justify-self: start;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            width: 42px;
            min-width: 42px;
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            text-align: left;
            font-size: 13px;
        }

        #opacityLabel.is-disabled {
            color: #cfcfcf;
        }

        .code-output {
            background: rgba(30, 30, 30, 0.75);
            border: 1px dashed #555555;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s; /* colors follow the picker instantly */
            position: relative;
            overflow: hidden;
        }

        .code-output:hover {
            background: rgba(50, 50, 50, 0.8);
            border-color: #00ff00;
        }

        .code-output.copied {
            border-color: #00ff00;
            transition: all 0.2s;
        }

        .code-output.fading,
        .code-output.fading:hover {
            background: rgba(30, 30, 30, 0.75);
            border-color: #555555;
            transition: background 0.4s ease, border-color 0.4s ease, color 0.2s, transform 0.2s;
        }

        .code-output:active {
            transform: scale(0.98);
        }

        .hint {
            color: #cfcfcf;
            font-size: 10px;
        }

        @media (max-width: 820px) {
            body, html {
                height: auto;
                min-height: 100%;
                overflow-y: auto;
            }

            .image-container {
                margin-top: 90px;
            }

            body {
                box-sizing: border-box;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .controls-shell {
                position: static;
                transform: none;
                margin: 16px auto;
                flex-direction: column;
                width: min(92vw, 450px);
            }

            .tester-ui {
                width: auto;
                display: flex;
            }

            .code-output {
                margin: 0 -10px;
            }

            .picker-group {
                flex: 1;
                margin: -5px -10px -5px;
                min-height: 210px;
            }
        }

        /* Fade in on entering the page and fade out when leaving it for the menu (same feel as the other pages). */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            opacity: 1;
            pointer-events: none;
            z-index: 2147483647;
            transition: opacity 420ms ease;
        }

        html.page-entered .page-transition-overlay {
            opacity: 0;
        }

        body > :not(.page-transition-overlay):not(script) {
            opacity: 0;
            transition: opacity 420ms ease;
        }

        html.page-entered body > :not(.page-transition-overlay):not(script) {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .page-transition-overlay,
            body > :not(.page-transition-overlay):not(script) {
                transition: none;
            }
        }

        /* page background image: the picture, darkened evenly so the white text and dark panels stay readable */
        html {
            background-color: #6e6e6e;
            background-image: url('backgroundcolorpickerbackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-blend-mode: multiply;
        }

        body {
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="page-transition-overlay" aria-hidden="true"></div>
    <div id="home-menu-button">
        <a class="home-menu-link" href="/" aria-label="Open the KDAssist menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="home-icon-body" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>

    <div class="page-title">
        <div class="page-title-main">
            <span class="title-text">KDASSIST
                <img class="title-icon" src="/icons/bgcolorpickericon.png.png" alt="">
            </span>
        </div>
        <div class="page-subtitle">Background Color Picker</div>
    </div>

    <div class="image-container">
        <img src="/icons/profilebackground1.png" alt="Profile Background" class="large-preview">
        <div class="color-overlay" id="colorOverlay"></div>
    </div>

    <div class="controls-shell">
        <div class="tester-ui">
            <label>Background Color</label>

            <div class="input-row">
                <input type="text" id="colorInput" placeholder="<body bgcolor=#3B5998>" spellcheck="false">
                <input type="color" id="colorPicker" value="#3b5998" tabindex="-1" aria-hidden="true">
            </div>

            <div class="toggle-row">
                <label for="shadingToggle" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="shadingToggle">
                    Suffix:
                </label>
                <input type="hidden" id="suffixSlider" value="0">
                <div class="custom-slider" id="suffixSliderControl" role="slider" tabindex="0" aria-label="Suffix opacity" aria-valuemin="0" aria-valuemax="675" aria-valuenow="0">
                    <div class="custom-slider-track">
                        <div class="custom-slider-fill" id="suffixSliderFill"></div>
                    </div>
                    <div class="custom-slider-thumb" id="suffixSliderThumb"></div>
          </div>
          <span id="suffixLabel" style="display:none">VI</span><span id="opacityLabel">Solid</span>
        </div>
        <div class="hint"><span style="color: #ff0000; font-weight: bold;">WARNING:</span> <span style="color: #ffffff; font-size: 8px;">Some suffixes may not work correctly in-game and also may result in slight inconsistencies in color shades.</span></div>

        <div class="picker-group">
                <div class="color-picker-box" id="colorPickerBox">
                    <canvas class="shade-canvas" id="shadeCanvas"></canvas>
                    <div class="color-picker-cursor" id="colorPickerCursor"></div>
                </div>
                <div class="hue-strip" id="hueStrip" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360">
                    <div class="hue-thumb" id="hueThumb"></div>
                </div>
            </div>

            <div class="code-output" id="copyBox" title="Click to copy code">
                Copy
                <span id="hexDisplay" style="display:none">#3B5998AA</span>
            </div>

      </div>
    </div>

        const SORTED_BY_OPACITY = Object.entries(ALL_SUFFIX_OPACITY)

        const SLIDER_MAX = SORTED_BY_OPACITY.length - 1;

        const input = document.getElementById('colorInput');
        const picker = document.getElementById('colorPicker');

        function sliderIndexToSuffix(index) {
            return SORTED_BY_OPACITY[Math.round(index)][0];

        function sliderIndexToOpacity(index) {
            return SORTED_BY_OPACITY[Math.round(index)][1] / 100;

            const index = SORTED_BY_OPACITY.findIndex(([key]) => key === String(suffix || '').toUpperCase());
            return index >= 0 ? index : 0;
        }

        function copyToClipboardWithFlash(target, text, setCopied, restore) {

                    const area = document.createElement('textarea');
                    area.value = text;
                    area.style.position = 'fixed';
                    area.style.left = '-9999px';
                    document.body.appendChild(area);
                    area.focus();
                    area.select();
                    try {

                    } catch (error) {
                        reject(error);
                    } finally {

                    }

                window.setTimeout(restore, 900);
            }).catch(() => {

                window.setTimeout(restore, 900);

        function clampSliderValue(value) {
            const numericValue = Number(value);

            return Math.min(SLIDER_MAX, Math.max(0, Math.round(numericValue)));

        function renderCustomSlider() {

        let overlayFadeTimer = 0;

        function updateSystem(newColor, source) {
            if (typeof newColor === 'string' && /^#[0-9a-f]{6}([a-z]{2})?$/i.test(newColor)) {
                currentHex = newColor.substring(0, 7).toUpperCase();
                if (newColor.length >= 9) currentSuffix = newColor.substring(7, 9).toUpperCase();

            return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };

        // Paints the saturation (left to right) / brightness (bottom to top) shades for the current hue.
        const shadeCanvas = document.getElementById('shadeCanvas');
        function drawShades() {
            const rect = shadeCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const scale = Math.min(window.devicePixelRatio || 1, 1.5); // smooth gradient, so no need for full density

            const rect = hueStrip.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const horizontal = rect.width > rect.height;
            const ratio = horizontal

                : (clientY - rect.top) / rect.height;

            const { r, g, b } = hexToRgb(currentHex);

            updateSystem(rgbToHex(next.r, next.g, next.b) + (shadingToggle.checked ? currentSuffix : ''), 'huestrip');
        }

        hueStrip.addEventListener('pointerdown', (e) => {

                isDraggingHue = false;
                syncColorPickerBox(currentHex);
            });
        });

        function setColorFromPointer(clientX, clientY) {
            const rect = colorPickerBox.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const s = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
            const v = Math.min(1, Math.max(0, 1 - (clientY - rect.top) / rect.height));
            colorPickerCursor.style.left = `${s * 100}%`;
            colorPickerCursor.style.top = `${(1 - v) * 100}%`;
            lastSaturation = s;
            lastValue = v;
            const { r, g, b } = hsvToRgb(currentHue, s, v);

            const base = match[1].startsWith('#') ? match[1] : `#${match[1]}`;

            if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') nextValue -= 1;
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') nextValue += 1;
            if (e.key === 'PageDown') nextValue -= 10;
            if (e.key === 'PageUp') nextValue += 10;

            isCopyBoxBusy = true;

                copyBox.style.color = '#00ff00';
                copyBox.classList.remove('fading');
                copyBox.classList.add('copied');

                copyBox.innerHTML = copyBoxOriginalHTML;
                copyBox.style.color = '#fff';
                copyBox.classList.remove('copied');
                copyBox.classList.add('fading');

            window.setTimeout(() => {
                if (!isCopyBoxBusy) copyBox.classList.remove('fading');
            }, 400);

        const DEFAULT_OPACITY_INDEX = SORTED_BY_OPACITY.reduce((best, entry, i) =>
            (Math.abs(entry[1] - 50) < Math.abs(SORTED_BY_OPACITY[best][1] - 50) ? i : best), 0);
        suffixSlider.value = String(DEFAULT_OPACITY_INDEX);
        currentSuffix = sliderIndexToSuffix(DEFAULT_OPACITY_INDEX);
        updateSystem('#3B5998', 'input');

        // Mobile: grow the panel's bottom edge to the screen bottom (16px gap) without moving its top.
        const testerUi = document.querySelector('.tester-ui');
        function fitPanelToBottom() {
            testerUi.style.minHeight = '';
            document.body.style.paddingTop = '';
            if (!window.matchMedia('(max-width: 820px)').matches) return;
            const rect = testerUi.getBoundingClientRect();
            const extra = Math.floor(window.innerHeight - 16 - rect.bottom);
            if (extra <= 0) return;
            testerUi.style.minHeight = `${rect.height + extra}px`;
            // Body centers its content, so offset the growth to keep the top where it was.
            document.body.style.paddingTop = `${extra}px`;
        }
        window.addEventListener('resize', fitPanelToBottom);
        window.addEventListener('load', fitPanelToBottom);
        fitPanelToBottom();

        const pageTitle = document.querySelector('.page-title');
        const homeMenuButton = document.getElementById('home-menu-button');

        function centerPageTitle() {
            const imageTop = imageContainer.getBoundingClientRect().top;
            const titleHeight = pageTitle.getBoundingClientRect().height;
            if (!window.matchMedia('(max-width: 820px)').matches) {
                // Desktop: center between the top of the screen and the image.
                pageTitle.style.top = `${Math.max(0, (imageTop - titleHeight) / 2)}px`;
                return;
            }
            const buttonBottom = homeMenuButton.getBoundingClientRect().bottom;
            const midpoint = (buttonBottom + imageTop) / 2;
            pageTitle.style.top = `${Math.max(buttonBottom, midpoint - titleHeight / 2)}px`;
        }

        window.addEventListener('resize', centerPageTitle);
        window.addEventListener('load', centerPageTitle);
        centerPageTitle();
    </script>
    <script>
        (() => {
            const root = document.documentElement;
            const overlay = document.querySelector(".page-transition-overlay");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let leaving = false;

            function enter() {
                leaving = false;
                overlay.style.display = "block";
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    root.classList.add("page-entered");
                    setTimeout(() => { if (!leaving) overlay.style.display = "none"; }, 500);
                }));
            }

            enter();
            // Coming back with the browser back button restores the page from cache, so fade in again.
            window.addEventListener("pageshow", (event) => { if (event.persisted) enter(); });

            document.querySelectorAll(".home-menu-link").forEach((link) => {
                link.addEventListener("click", (event) => {
                    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                    event.preventDefault();
                    leaving = true;
                    overlay.style.display = "block";
                    void overlay.offsetWidth;
                    root.classList.remove("page-entered");
                    setTimeout(() => { window.location.href = link.href; }, reducedMotion ? 0 : 420);
                });
            });
        })();
    </script>
</body>
</html>
