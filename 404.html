<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="/pageZoomGuard.js?v=20260920-mobile-page-zoom"></script>
  <title>Redirecting...</title>
  <script>
    (function () {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var lower = path.toLowerCase();

      // Old address: /benchmark and everything under it now lives at /bkbenchmark.
      if (lower === '/benchmark' || lower.indexOf('/benchmark/') === 0) {
        window.location.replace('/bkbenchmark' + path.slice('/benchmark'.length) + search + hash);
        return;
      }
      var isBenchmarkRoute = lower.indexOf('/bkbenchmark/') >= 0 || lower === '/bkbenchmark';
      var isKnownBenchmarkPath =
        lower === '/bkbenchmark' ||
        lower === '/bkbenchmark/' ||
        lower === '/bkbenchmark/sign-up' ||
        lower === '/bkbenchmark/sign-up/' ||
        lower === '/bkbenchmark/forgot-password' ||
        lower === '/bkbenchmark/forgot-password/' ||
        lower === '/bkbenchmark/verification-sent' ||
        lower === '/bkbenchmark/verification-sent/' ||
        lower === '/bkbenchmark/benchmark.html' ||
        lower === '/bkbenchmark/index.html';

      var hasFileExtension = /\.[a-z0-9]+$/i.test(path);

      if (isBenchmarkRoute && !isKnownBenchmarkPath && !hasFileExtension) {
        var restoreTarget = path + search + hash;
        window.location.replace('/bkbenchmark/benchmark.html?__restore=' + encodeURIComponent(restoreTarget));
        return;
      }

      window.location.replace('/bkbenchmark/');
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
